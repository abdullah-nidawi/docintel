[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.1.0"
description = "Local-first document intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2", "celery[redis]>=5.4,<6", "fastapi>=0.115,<1",
  "httpx>=0.27,<1", "pgvector>=0.3,<1", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "pymupdf>=1.24,<2",
  "python-multipart>=0.0.12,<1", "sentence-transformers>=3.1,<6",
  "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
